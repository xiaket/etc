# Your patch layer for every dsh profile on this machine, applied after every
# bundle layer: a top-level YAML array of loader patch entries (id-targeted
# config overrides, disables, and insert lists; `!!js` expressions allowed).
#
# Per-profile patches live in profiles/<name>/cordis.patch.yml and apply after
# this file.

# Engram: persistent memory for AI coding agents, over its stdio MCP server.
# The binary is installed by the `engram` task in
# ~/.xiaket/etc/bootstrap/macos.sh (or bootstrap/opensuse.sh on Linux hosts).
# Tools reach the model as `mcp__engram__*`.
- insert:
    - id: memory-engram
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: engram
        transport: stdio
        command: engram
        # --tools=agent is the 15-tool memory read/write set; the 4 admin tools
        # stay out of the model's tool list. `engram doctor` and `engram tui`
        # remain available from a terminal.
        #
        # --project pins one shared memory pool for every working directory.
        # Engram otherwise derives the project from the cwd's Git root, which
        # would split memory per repository.
        args: ['mcp', '--tools=agent', '--project', 'global']
        cwd: !!js process.cwd()
        # A devbox reset removes ~/.local/bin/engram until bootstrap.sh reruns;
        # the harness must still start, with this server's tools simply absent.
        failOnStartupError: false
